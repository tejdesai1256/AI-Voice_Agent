
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; =========================
; SIP USER 1001 - LAPTOP
; =========================

[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=ChangeThis_1001_Strong!

[1001]
type=aor
max_contacts=5
remove_existing=yes

