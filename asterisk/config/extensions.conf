
[internal]

; --- Prevent caller from calling their own extension ---
exten => 1001,1,NoOp(=== Call to Laptop 1001 from ${CALLERID(all)} ===)
 same => n,GotoIf($["${CALLERID(num)}" = "1001"]?self)
 same => n,Dial(PJSIP/1001,30)
 same => n,NoOp(Dial Status for 1001: ${DIALSTATUS})
 same => n,Goto(status-${DIALSTATUS},1)
 same => n(self),NoOp(Self-calling 1001 rejected)
 same => n,Busy(17)

exten => 1002,1,NoOp(=== Call to Mobile 1002 from ${CALLERID(all)} ===)
 same => n,GotoIf($["${CALLERID(num)}" = "1002"]?self)
 same => n,Dial(PJSIP/1002,30)
 same => n,NoOp(Dial Status for 1002: ${DIALSTATUS})
 same => n,Goto(status-${DIALSTATUS},1)
 same => n(self),NoOp(Self-calling 1002 rejected)
 same => n,Busy(17)

; --- Aliases for User Mobile Number 9579228277 ---
exten => 9579228277,1,NoOp(Mapping 9579228277 to Mobile 1002)
 same => n,Goto(internal,1002,1)

exten => +919579228277,1,NoOp(Mapping +919579228277 to Mobile 1002)
 same => n,Goto(internal,1002,1)

exten => 09579228277,1,NoOp(Mapping 09579228277 to Mobile 1002)
 same => n,Goto(internal,1002,1)

; --- Audio Echo Test (Extension 600) ---
exten => 600,1,NoOp(=== Audio Echo Test by ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest,skip)
 same => n,Echo()
 same => n,Hangup()

; --- AI Voice Agent Service Test (Extension 700) ---
exten => 700,1,NoOp(=== AI Voice Agent Test Extension ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats,skip)
 same => n,Echo()
 same => n,Hangup()

; --- DIALSTATUS Handlers (Avoid misleading SIP 404 "User not found") ---
exten => status-BUSY,1,NoOp(Target is BUSY)
 same => n,Playtones(busy)
 same => n,Busy(17)

exten => status-NOANSWER,1,NoOp(Target did not answer)
 same => n,Playtones(congestion)
 same => n,Hangup(19)

exten => status-CHANUNAVAIL,1,NoOp(Target channel unavailable / offline)
 same => n,Playtones(congestion)
 same => n,Congestion(20)

exten => status-CONGESTION,1,NoOp(Target network congested)
 same => n,Playtones(congestion)
 same => n,Congestion(20)

exten => _status-.,1,NoOp(Unhandled status ${DIALSTATUS})
 same => n,Hangup()
